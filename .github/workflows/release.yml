name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to package
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Keep release verification on the same pinned toolchain as CI.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify immutable release identity
        run: |
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          Scripts/verify-version.sh --tag "$RELEASE_TAG"

      - name: Verify source quality
        run: |
          Scripts/check-repository.sh
          Scripts/check-source-safety.sh
          bash -n Scripts/*.sh
          xcrun swift-format lint --strict --configuration .swift-format --recursive Sources Tests UITests

      - name: Run package tests
        run: swift test

      - name: Verify generated project
        run: |
          Scripts/xcodegen.sh generate
          git diff --exit-code -- Screenlog.xcodeproj/project.pbxproj

      - name: Run app presentation tests
        run: |
          xcodebuild \
            -project Screenlog.xcodeproj \
            -scheme ScreenlogAppTests \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/ReleaseAppTestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            test

      - name: Build and verify ad-hoc signed universal assets
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${RELEASE_TAG}^{commit}")"
          Scripts/package-release.sh \
            --expected-tag "$RELEASE_TAG" \
            --output build/releases

      - name: Generate signed update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          dmg=(build/releases/Screenlogger-*.dmg)
          test "${#dmg[@]}" -eq 1
          Scripts/generate-update-feed.sh \
            --archive "${dmg[0]}" \
            --output build/releases/appcast.xml \
            --tag "$RELEASE_TAG"

      - name: Compile routed UI contracts
        run: |
          xcodebuild \
            -project Screenlog.xcodeproj \
            -scheme ScreenlogUI \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/ReleaseUITestDerivedData \
            -only-testing:ScreenlogAppUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build-for-testing

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenlogger-release-${{ env.RELEASE_TAG }}
          path: |
            build/releases/Screenlogger-*.dmg
            build/releases/Screenlogger-*.dmg.sha256
            build/releases/Screenlogger-*.zip
            build/releases/Screenlogger-*.zip.sha256
            build/releases/Screenlogger-*.json
            build/releases/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-draft:
    name: Publish ad-hoc signed draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenlogger-release-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Create or refresh the ad-hoc signed draft release
        run: |
          shopt -s nullglob
          assets=(release-assets/Screenlogger-* release-assets/appcast.xml)
          if (( ${#assets[@]} == 0 )); then
            echo "error: verified release artifact is empty" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "error: refusing to overwrite an already-published release" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "Screenlogger $RELEASE_TAG - ad-hoc signed preview"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "Screenlogger $RELEASE_TAG - ad-hoc signed preview" \
              --notes "Ad-hoc signed preview build; it is not Developer ID signed or notarized. Verify the DMG's published SHA-256 for the first installation. In-app updates use Screenlogger's separate Ed25519 signing key and signed update feed."
          fi
